# Birthday Reminder settings - edit, save, done. No reinstall needed.
# Updating the app never overwrites this file; new settings are added to the bottom.

# The earliest time of day you want to be told. Nothing is shown before this.
# This is the setting most people are looking for: 24-hour clock, "HH:MM".
NOTIFY_AFTER="07:00"

# Unlocked is not the same as sitting there. If the Mac has seen no typing or trackpad
# movement for this many seconds, the popup waits rather than opening to an empty room.
# It tries again every 5 minutes, so it appears when you come back.
# Set to 0 to switch this off and show as soon as the screen is unlocked.
PRESENCE_IDLE_MAX="600"

# A popup seen before this time does not count for the school day.
# So if you are still working at 00:05 and see it, it shows again on your
# first lid-open after this time.
MORNING_CUTOFF="06:00"

# Announce Saturday/Sunday birthdays on the Friday before.
WEEKEND_ROLL="yes"

# Also show on the actual Saturday/Sunday if you happen to be at the Mac.
SHOW_ON_WEEKEND="yes"

# If your Mac was off/asleep over a birthday, tell you when you next open it.
# Looks back this many days.
CATCHUP_DAYS="7"

# Opening the app shows today's birthdays first, with a button through to the calendar.
# Set to "no" to land straight on the calendar every time.
OPEN_WITH_TODAY="yes"

# auto   = hide names when a second display / mirroring is detected (projector safety)
# always = always require a click before names appear
# never  = never hide
DISCREET_MODE="auto"

# Which browser shows the birthday window.
#   auto  = pick one you do not already have open, so closing the window drops you
#           back where you were instead of raising a browser full of your own tabs
# Or force one: Safari, Google Chrome, Microsoft Edge, Brave Browser
POPUP_BROWSER="auto"
